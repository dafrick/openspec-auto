name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Core linters (blocking) ───────────────────────────────────────────────

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skill/openspec-auto/package-lock.json
      - uses: extractions/setup-just@v2
      - run: npm ci
        working-directory: skill/openspec-auto
      - run: just typecheck

  lint-scripts:
    name: lint-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: skill/openspec-auto/package-lock.json
      - uses: extractions/setup-just@v2
      - run: npm ci
        working-directory: skill/openspec-auto
      - run: just lint-scripts

  lint-md:
    name: lint-md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: extractions/setup-just@v2
      - run: npm ci
      - run: just lint-md

  # ── Experimental skill linters (non-blocking) ────────────────────────────

  lint-quick-validate:
    name: lint-quick-validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: extractions/setup-just@v2
      - run: just lint-quick-validate

  lint-skill-lint:
    name: lint-skill-lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just lint-skill-lint

  lint-agent-skills-lint:
    name: lint-agent-skills-lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just lint-agent-skills-lint

  lint-skill-check:
    name: lint-skill-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just lint-skill-check

  lint-agent-skill-linter:
    name: lint-agent-skill-linter
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just lint-agent-skill-linter

  lint-pulser:
    name: lint-pulser
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just lint-pulser

  lint-cclint:
    name: lint-cclint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: extractions/setup-just@v2
      - run: go install github.com/dotcommander/cclint@latest
      - run: just lint-cclint

  lint-agnix:
    name: lint-agnix
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v2
      - run: just lint-agnix

  lint-skillscan:
    name: lint-skillscan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: extractions/setup-just@v2
      - run: just lint-skillscan
